services:
  api:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
      WEATHER_DATA_DIR: /data
    volumes:
      - api-data:/data

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  api-data:
